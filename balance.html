<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AwaazPay — educational HCI prototype. Demo only: no real money is transferred.">
  <title>AwaazPay</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="balance" data-title="bl.title">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
  <div id="demo-banner"></div>
  <header id="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="narrow">
      <h1 data-i18n="bl.heading"></h1>
      <section class="card center" aria-labelledby="bal-label">
        <p id="bal-label" class="muted" style="margin-bottom:0" data-i18n="bl.label"></p>
        <p class="big-number" id="balanceValue" aria-live="polite"></p>
        <p class="small"><span data-i18n="bl.account"></span>: <span class="ltr" id="acctNo"></span></p>
        <span class="badge badge-demo" data-i18n="tx.demo_tag" style="margin-bottom:0.6rem"></span>
      </section>
      <div class="notice notice-warn" style="margin-top:1rem"><span class="mark" aria-hidden="true">!</span><span data-i18n="bl.note"></span></div>
      <div class="btn-row">
        <button id="readBalance" type="button" class="btn"><img class="icon" src="assets/icons/mic.svg" alt="" width="24" height="24" aria-hidden="true"><span data-i18n="bl.read"></span></button>
        <a class="btn" href="voice-assistant.html"><span data-i18n="bl.ask"></span></a>
        <a class="btn btn-primary" href="dashboard.html"><img class="icon" src="assets/icons/home-white.svg" alt="" width="24" height="24" aria-hidden="true"><span data-i18n="common.dashboard"></span></a>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p class="notice notice-error" style="margin:1rem">JavaScript is required / اس صفحے کے لیے JavaScript ضروری ہے۔</p></noscript>
  <script src="js/demo-data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
